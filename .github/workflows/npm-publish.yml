name: Release to NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release (will be used as the tag name)
        required: true
      latest:
        type: boolean
        description: Whether to use the most recent version as the version to release
        required: false
        default: false

permissions:
  id-token: write # Required for OIDC
  contents: write # To push version changes

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Activate corepack
        run: corepack enable

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Set version to release tag
        shell: bash
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Publish
        shell: bash
        run: yarn npm publish

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.event.inputs.version }}" --title "Release ${{ github.event.inputs.version }}" --latest="${{ github.event.inputs.latest }}"

      - name: Push version changes to branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: release ${{ github.ref_name }}'
          branch: ${{ github.ref_name }}
          file_pattern: package.json
